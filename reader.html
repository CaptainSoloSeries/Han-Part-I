<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reader</title>

<style>
  :root {
    --bar-bg: #ffffff;
    --bar-fg: #222222;
    --bar-line: #dddddd;
    --stage-bg: #e9e9e9;
    --accent: #c0392b;
  }
  body[data-theme="sepia"] {
    --bar-bg: #efe4cb; --bar-fg: #4a3b22; --bar-line: #d9c9a3; --stage-bg: #f4ecd8;
  }
  body[data-theme="dark"] {
    --bar-bg: #1a1a1a; --bar-fg: #e6e6e6; --bar-line: #333333; --stage-bg: #121212;
  }
  body[data-theme="sepia"] canvas { filter: sepia(0.4) brightness(0.97); }
  body[data-theme="dark"]  canvas { filter: invert(0.88) hue-rotate(180deg); }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--stage-bg); color: var(--bar-fg);
    display: flex; flex-direction: column;
  }

  .bar {
    background: var(--bar-bg); color: var(--bar-fg);
    border-color: var(--bar-line); border-style: solid; border-width: 0;
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
    transition: transform .2s ease, opacity .2s ease; z-index: 5;
  }
  #topbar { border-bottom-width: 1px; padding-top: max(6px, env(safe-area-inset-top)); }
  #bottombar { border-top-width: 1px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  body.hide-ui #topbar { transform: translateY(-100%); opacity: 0; position: absolute; left: 0; right: 0; pointer-events: none; }
  body.hide-ui #bottombar { transform: translateY(100%); opacity: 0; position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }

  button {
    background: none; border: 0; color: inherit; font: inherit; cursor: pointer;
    min-width: 38px; height: 38px; border-radius: 8px; font-size: 18px; line-height: 1;
  }
  button:hover { background: rgba(128,128,128,.18); }
  button:focus-visible { outline: 2px solid var(--accent); }
  button:disabled { opacity: .35; cursor: default; }

  #title { flex: 1; min-width: 0; font-weight: 600; font-size: 15px;
           white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  #pageinfo { font-size: 13px; white-space: nowrap; min-width: 84px; text-align: center; opacity: .85; }

  #slider { flex: 1; accent-color: var(--accent); height: 28px; }

  #stage {
    flex: 1; min-height: 0; overflow: auto; display: flex; position: relative;
    background: var(--stage-bg); -webkit-overflow-scrolling: touch;
  }
  #pagewrap { margin: auto; padding: 8px; }
  canvas { display: block; box-shadow: 0 2px 14px rgba(0,0,0,.35); background: #fff; }

  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         text-align: center; padding: 24px; font-size: 16px; pointer-events: none; }
  #msg.hidden { display: none; }

  /* chapter drawer */
  #drawer {
    position: absolute; top: 0; bottom: 0; left: 0; width: min(320px, 85vw);
    background: var(--bar-bg); color: var(--bar-fg); border-right: 1px solid var(--bar-line);
    transform: translateX(-100%); transition: transform .2s ease; z-index: 10;
    display: flex; flex-direction: column;
  }
  body.drawer-open #drawer { transform: none; box-shadow: 4px 0 20px rgba(0,0,0,.35); }
  #drawer h2 { margin: 0; padding: 14px 16px; font-size: 16px; border-bottom: 1px solid var(--bar-line); }
  #chlist { overflow: auto; flex: 1; list-style: none; margin: 0; padding: 4px 0; }
  #chlist li button {
    width: 100%; text-align: left; height: auto; padding: 11px 16px; font-size: 15px; border-radius: 0;
  }
  #chlist li button[aria-current="true"] { background: rgba(192,57,43,.18); font-weight: 600; }
  #scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 9; display: none; }
  body.drawer-open #scrim { display: block; }

  @media (max-width: 520px) {
    #pageinfo { min-width: 64px; font-size: 12px; }
    .desktop-only { display: none; }
  }
</style>
</head>

<body data-theme="light">

<!-- ============ TOP BAR ============ -->
<div class="bar" id="topbar">
  <button id="btn-menu" title="Chapters" aria-label="Chapter list">&#9776;</button>
  <div id="title">Loading&hellip;</div>
  <button id="btn-zoomout" title="Zoom out" aria-label="Zoom out">&minus;</button>
  <button id="btn-zoomin" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="btn-theme" title="Change theme (T)" aria-label="Change theme">&#9728;</button>
  <button id="btn-full" title="Open full screen (F)" aria-label="Open full screen">&#x26F6;</button>
</div>

<!-- ============ READING AREA ============ -->
<div id="stage">
  <div id="pagewrap"></div>
  <div id="msg">Loading&hellip;</div>
</div>

<!-- ============ BOTTOM BAR ============ -->
<div class="bar" id="bottombar">
  <button id="btn-prev" title="Previous page" aria-label="Previous page">&#8249;</button>
  <input id="slider" type="range" min="1" max="1" value="1" aria-label="Page slider">
  <div id="pageinfo">&ndash;</div>
  <button id="btn-next" title="Next page" aria-label="Next page">&#8250;</button>
</div>

<div id="scrim"></div>
<nav id="drawer" aria-label="Chapters">
  <h2 id="drawer-title">Chapters</h2>
  <ul id="chlist"></ul>
</nav>

<!-- PDF.js (loaded from a CDN, nothing to install) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/* =====================================================================
   SETTINGS: this is the only section you need to edit
   ===================================================================== */
const BOOK_TITLE    = "Captain Solo Series";   // shown in the chapter menu
const CHAPTER_COUNT = 40;                      // how many chapters you have
const CHAPTER_FOLDER = "chapters/";            // folder in your repo holding the PDFs
// Files are expected to be named ch01.pdf, ch02.pdf ... ch40.pdf.
// To use different names, edit the chapterFile() function below.
const chapterFile = n => CHAPTER_FOLDER + "ch" + String(n).padStart(2, "0") + ".pdf";

// Optional: give chapters real titles. Any you skip show as "Chapter N".
const CHAPTER_TITLES = {
  // 1: "Hey Kid",
  // 2: "The Kessel Question",
};
/* ===================================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const stage = $("stage"), wrap = $("pagewrap"), msg = $("msg");
const slider = $("slider"), pageinfo = $("pageinfo");

let pdf = null, chapter = 1, pageNum = 1, total = 1;
let zoom = 1, renderId = 0, renderTask = null;

const store = {
  get(k)    { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const chTitle = n => CHAPTER_TITLES[n] ? "Chapter " + n + ": " + CHAPTER_TITLES[n] : "Chapter " + n;

function showMsg(text) { msg.textContent = text; msg.classList.remove("hidden"); }
function hideMsg()     { msg.classList.add("hidden"); }

/* ---------- themes ---------- */
const THEMES = ["light", "sepia", "dark"];
function setTheme(t) {
  document.body.dataset.theme = t;
  store.set("reader-theme", t);
}
function cycleTheme() {
  const i = THEMES.indexOf(document.body.dataset.theme);
  setTheme(THEMES[(i + 1) % THEMES.length]);
}

/* ---------- loading a chapter ---------- */
async function loadChapter(n, startAt) {
  if (n < 1 || n > CHAPTER_COUNT) return;
  chapter = n;
  document.title = BOOK_TITLE + " \u2013 " + chTitle(n);
  $("title").textContent = chTitle(n);
  updateChapterList();
  showMsg("Loading " + chTitle(n) + "\u2026");
  wrap.replaceChildren();
  renderId++;

  // keep the address bar in sync so refresh / sharing works
  try {
    const u = new URL(location.href);
    u.searchParams.set("ch", n);
    history.replaceState(null, "", u);
  } catch (e) {}

  try {
    if (pdf) { pdf.destroy(); pdf = null; }
    pdf = await pdfjsLib.getDocument(chapterFile(n)).promise;
  } catch (e) {
    console.error(e);
    showMsg("Couldn't load " + chTitle(n) + ". Check that " + chapterFile(n) + " exists in your repository.");
    return;
  }
  total = pdf.numPages;
  slider.max = total;

  let start = 1;
  if (startAt === "last") start = total;
  else if (typeof startAt === "number") start = startAt;
  else {
    const saved = parseInt(store.get("reader-page-" + n), 10);
    if (saved >= 1 && saved <= total) start = saved;
  }
  hideMsg();
  goTo(start);
}

/* ---------- rendering a page ---------- */
async function render() {
  if (!pdf) return;
  const my = ++renderId;
  if (renderTask) { try { renderTask.cancel(); } catch (e) {} }

  const page = await pdf.getPage(pageNum);
  if (my !== renderId) return;

  const base = page.getViewport({ scale: 1 });
  const availW = stage.clientWidth - 16;
  const availH = stage.clientHeight - 16;
  const fit = Math.min(availW / base.width, availH / base.height);
  const vp = page.getViewport({ scale: fit * zoom });

  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const canvas = document.createElement("canvas");
  canvas.width  = Math.floor(vp.width  * dpr);
  canvas.height = Math.floor(vp.height * dpr);
  canvas.style.width  = Math.floor(vp.width)  + "px";
  canvas.style.height = Math.floor(vp.height) + "px";

  renderTask = page.render({
    canvasContext: canvas.getContext("2d"),
    viewport: vp,
    transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
  });
  try { await renderTask.promise; }
  catch (e) { if (e && e.name === "RenderingCancelledException") return; console.error(e); return; }
  if (my !== renderId) return;

  wrap.replaceChildren(canvas);
  stage.scrollTop = 0;
}

function updateUI() {
  pageinfo.textContent = pageNum + " / " + total;
  slider.value = pageNum;
  $("btn-prev").disabled = (pageNum === 1 && chapter === 1);
  $("btn-next").disabled = (pageNum === total && chapter === CHAPTER_COUNT);
}

function goTo(n) {
  pageNum = Math.max(1, Math.min(total, n));
  store.set("reader-page-" + chapter, pageNum);
  updateUI();
  render();
}

function next() {
  if (pageNum < total) goTo(pageNum + 1);
  else if (chapter < CHAPTER_COUNT) loadChapter(chapter + 1, 1);
}
function prev() {
  if (pageNum > 1) goTo(pageNum - 1);
  else if (chapter > 1) loadChapter(chapter - 1, "last");
}

/* ---------- chapter drawer ---------- */
function buildChapterList() {
  $("drawer-title").textContent = BOOK_TITLE;
  const ul = $("chlist");
  for (let n = 1; n <= CHAPTER_COUNT; n++) {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.textContent = chTitle(n);
    b.dataset.ch = n;
    b.addEventListener("click", () => { closeDrawer(); loadChapter(n, 1); });
    li.appendChild(b);
    ul.appendChild(li);
  }
}
function updateChapterList() {
  document.querySelectorAll("#chlist button").forEach(b => {
    b.setAttribute("aria-current", String(Number(b.dataset.ch) === chapter));
  });
}
function openDrawer()  {
  document.body.classList.add("drawer-open");
  const cur = document.querySelector('#chlist button[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: "center" });
}
function closeDrawer() { document.body.classList.remove("drawer-open"); }

/* ---------- controls ---------- */
$("btn-next").onclick = next;
$("btn-prev").onclick = prev;
slider.oninput = () => goTo(parseInt(slider.value, 10));
$("btn-theme").onclick = cycleTheme;
$("btn-menu").onclick = openDrawer;
$("scrim").onclick = closeDrawer;
$("btn-zoomin").onclick  = () => { zoom = Math.min(3, +(zoom + 0.25).toFixed(2)); render(); };
$("btn-zoomout").onclick = () => { zoom = Math.max(1, +(zoom - 0.25).toFixed(2)); render(); };

// Full screen: inside a Google Sites embed, true fullscreen is usually blocked,
// so we open the reader in its own tab instead, which fills the whole window.
function goFull() {
  if (window.self !== window.top) {
    window.open(location.href, "_blank");
  } else if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
}
$("btn-full").onclick = goFull;

// Tap zones: left quarter = back, right quarter = forward, middle = show/hide toolbars
stage.addEventListener("click", e => {
  if (zoom > 1) return;
  const x = (e.clientX - stage.getBoundingClientRect().left) / stage.clientWidth;
  if (x < 0.25) prev();
  else if (x > 0.75) next();
  else document.body.classList.toggle("hide-ui");
});

// Swipe to turn pages
let tx = 0, ty = 0;
stage.addEventListener("touchstart", e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, { passive: true });
stage.addEventListener("touchend", e => {
  if (zoom > 1) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { dx < 0 ? next() : prev(); }
}, { passive: true });

// Keyboard
document.addEventListener("keydown", e => {
  if (e.target === slider && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
  switch (e.key) {
    case "ArrowRight": case "PageDown": case " ": e.preventDefault(); next(); break;
    case "ArrowLeft":  case "PageUp":               e.preventDefault(); prev(); break;
    case "Home": goTo(1); break;
    case "End":  goTo(total); break;
    case "t": case "T": cycleTheme(); break;
    case "f": case "F": goFull(); break;
    case "Escape": closeDrawer(); break;
  }
});

// Re-fit on resize / rotation
let rt;
window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });

/* ---------- start up ---------- */
(function init() {
  const saved = store.get("reader-theme");
  if (THEMES.includes(saved)) setTheme(saved);
  else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) setTheme("dark");

  buildChapterList();

  const params = new URLSearchParams(location.search);
  let n = parseInt(params.get("ch"), 10);
  if (!(n >= 1 && n <= CHAPTER_COUNT)) n = 1;
  loadChapter(n);
})();
</script>
</body>
</html>
